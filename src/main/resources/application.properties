spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/communitystoredb?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true

server.port=8080

# Comma separated list of origins allowed to call the API.
# Add your deployed frontend URL here when you host the app.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,https://*.e2b.app}
